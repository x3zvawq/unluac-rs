name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/unluac-wasm/**'
      - 'packages/unluac-web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/actions/setup-wasm-tools/**'
      - '.github/workflows/deploy-web.yml'
      - 'logo.svg'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/unluac-web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup WASM tools
        uses: ./.github/actions/setup-wasm-tools

      - name: Restore cargo build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock', 'src/**', 'packages/unluac-wasm/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install dependencies
        working-directory: packages/unluac-web
        run: npm ci

      - name: Build
        working-directory: packages/unluac-web
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          target: production
          working-directory: ${{ github.workspace }}/packages/unluac-web
